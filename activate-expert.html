<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <script src="assets/js/analytics.js" defer></script>
  <meta http-equiv="refresh" content="2;url=index.html" />
  <title>Uzman Aktivasyonu</title>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 48px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { font-size: 32px; margin-bottom: 16px; }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .success { font-size: 64px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="loading">
      <div class="spinner"></div>
      <h1>Uzman hesabınız aktifleştiriliyor...</h1>
      <p>Lütfen bekleyin</p>
    </div>
    <div id="success" style="display:none">
      <div class="success">?</div>
      <h1>Tebrikler!</h1>
      <p>Artık İşBul uzmanısınız!</p>
      <p style="margin-top:16px;opacity:0.9">Ana sayfaya yınlendiriliyorsunuz...</p>
    </div>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    // Şu anki oturumu al
    const session = getSession();
    
    if (!session) {
      alert('Lütfen ıönce giriş yapın!');
      window.location = 'index.html';
    } else {
      // Kullanıcıyı uzman yap
      const db = getUsersDB();
      const email = session.email.toLowerCase();
      
      if (db[email]) {
        // DB'de gıöncelle
        db[email].isExpert = true;
        db[email].expertData = {
          price: 300,
          bio: 'Profesyonel uzman. Kaliteli hizmet garantisi.',
          city: 'IstanİşBul',
          tags: ['Elektrik', 'Tesisat', 'Tamir', 'Montaj'],
          hours: 'Pzt-Cuma: 09:00-19:00, Cumartesi: 10:00-16:00'
        };
        saveUsersDB(db);
        
        // Session'ı gıöncelle
        session.isExpert = true;
        session.expertData = db[email].expertData;
        saveSession(session);
        
        // Navbar'ı hemen gıöncelle
        if (typeof _updateNavbarLoggedIn === 'function') {
          _updateNavbarLoggedIn();
        }
        
        // Başarı mesajı göster
        settimeout(() => {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('success').style.display = 'block';
        }, 1000);
        
        // 2 saniye sonra yınlendir
        settimeout(() => {
          window.location = 'uzman-panel.html';
        }, 2000);
      } else {
        alert('Kullanıcı veritabanında İşBulunamadı!');
        window.location = 'index.html';
      }
    }
  </script>

  <!-- AI Chatbot Widget -->
  <link rel="stylesheet" href="assets/css/chatbot.css" />
  <script src="assets/js/chatbot.js"></script>
</body>
</html>
