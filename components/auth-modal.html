<!-- ========== AUTH MODAL (Merkezi Component) ========== -->
<div class="modal-overlay" id="authModal">
  <div class="auth-modal-inner">
    <div class="auth-modal-header">
      <span class="navbar__logo"><span class="logo-icon">⚡</span><span class="logo-text"><strong>İşBul</strong></span></span>
      <button class="auth-modal-close" id="authModalClose">×</button>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Giriş Yap</button>
      <button class="auth-tab" data-tab="register">Ücretsiz Kaydol</button>
    </div>
    <div class="auth-body">
      <!-- GİRİŞ PANELİ -->
      <div class="auth-panel active" id="auth-login">
        <div class="auth-social">
          <button class="auth-social-btn" onclick="handleOAuth('google')">
            <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:8px">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Google ile Giriş
          </button>
        </div>
        <div class="auth-divider">veya e-posta ile</div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label>E-posta</label>
            <input type="email" name="email" placeholder="ornek@mail.com" required />
          </div>
          <div class="form-group">
            <label>Şifre <a href="#" class="auth-forgot" onclick="showToast('Şifre sıfırlama e-postası gönderildi!','info');return false">Şifremi unuttum</a></label>
            <input type="password" name="password" placeholder="••••••" required />
          </div>
          <button type="submit" class="auth-submit">Giriş Yap</button>
        </form>
        <p class="auth-footer">Hesabınız yok mu? <a href="#" onclick="document.querySelector('[data-tab=register]').click();return false">Kayıt olun</a></p>
      </div>
      <!-- KAYIT PANELİ -->
      <div class="auth-panel" id="auth-register">
        <div class="auth-social">
          <button class="auth-social-btn" onclick="handleOAuth('google')">
            <svg width="18" height="18" viewBox="0 0 18 18" style="margin-right:8px">
              <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
              <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
              <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Google ile Kayıt
          </button>
        </div>
        <div class="auth-divider">veya e-posta ile</div>
        <form id="registerForm" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label>Ad</label>
              <input type="text" name="regFirstName" placeholder="Adınız" required />
            </div>
            <div class="form-group">
              <label>Soyad</label>
              <input type="text" name="regLastName" placeholder="Soyadınız" required />
            </div>
          </div>
          <div class="form-group">
            <label>E-posta</label>
            <input type="email" name="regEmail" placeholder="ornek@mail.com" required />
          </div>
          <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="regPassword" placeholder="En az 8 karakter" required />
          </div>
          <div class="form-group">
            <label>Şifre Tekrar</label>
            <input type="password" name="regPasswordConfirm" placeholder="Şifreyi tekrar girin" required />
          </div>
          <button type="submit" class="auth-submit">Hesap Oluştur</button>
        </form>
        <p class="auth-footer">Hesabınız var mı? <a href="#" onclick="document.querySelector('[data-tab=login]').click();return false">Giriş yapın</a></p>
      </div>
    </div>
  </div>
</div>
