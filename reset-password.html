<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Config - Backend URL ve sabitler -->
  <script src="assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırla – İşBul</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="İşBul" />
  <link rel="apple-touch-icon" href="/assets/img/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/mobile.css" />
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6C63FF,#764ba2);padding:20px">
    <div style="background:#fff;border-radius:16px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <h1 style="font-size:24px;font-weight:800;margin-bottom:8px;text-align:center">Yeni Şifre Belirle</h1>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:32px;text-align:center">Hesabınız için yeni bir şifre oluşturun.</p>
      
      <form id="resetForm">
        <div style="margin-bottom:20px">
          <label style="display:block;font-weight:600;margin-bottom:8px;font-size:14px">Yeni Şifre</label>
          <input type="password" id="password" required minlength="8" placeholder="En az 8 karakter" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px">
        </div>
        
        <div style="margin-bottom:20px">
          <label style="display:block;font-weight:600;margin-bottom:8px;font-size:14px">Şifre Tekrar</label>
          <input type="password" id="confirmPassword" required minlength="8" placeholder="Şifrenizi tekrar girin" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px">
        </div>
        
        <button type="submit" class="btn btn--primary" style="width:100%;margin-bottom:16px">Şifreyi Güncelle</button>
      </form>
      
      <div style="text-align:center">
        <a href="login.html" style="color:var(--primary);font-size:14px;font-weight:600">← Giriş sayfasına dön</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      alert('❌ Geçersiz link. Lütfen şifre sıfırlama linkini tekrar kullanın.');
      window.location.href = 'forgot-password.html';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('❌ Şifreler eşleşmiyor!');
        return;
      }

      const btn = e.target.querySelector('button');
      const origText = btn.textContent;
      btn.textContent = 'Güncelleniyor...';
      btn.disabled = true;

      try {
        const res = await fetch(`${IsBulAPI.baseUrl}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password }),
        });
        const data = await res.json();

        if (data.success) {
          alert('✅ ' + data.message);
          window.location.href = 'login.html';
        } else {
          alert('❌ ' + (data.error || 'Bir hata oluştu.'));
          btn.textContent = origText;
          btn.disabled = false;
        }
      } catch (err) {
        alert('❌ Bağlantı hatası. Lütfen tekrar deneyin.');
        btn.textContent = origText;
        btn.disabled = false;
      }
    });
  </script>
  <script src="/assets/js/pwa.js" defer></script>
  <script src="/assets/js/mobile-nav.js" defer></script>

  <!-- ========== FOOTER ========== -->
    <div id="footer-container"></div>

</body>
</html>
