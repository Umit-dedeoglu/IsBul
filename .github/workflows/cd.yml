name: CD - Continuous Deployment

on:
  workflow_run:
    workflows: ["CI - Continuous Integration"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Deploy Backend to Render
  # ==========================================
  deploy-backend:
    name: Deploy Backend
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render backend deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Backend deployment triggered"
          fi

  # ==========================================
  # JOB 2: Deploy Frontend to Render
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render frontend deployment
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
            echo "Frontend deployment triggered"
          fi

  # ==========================================
  # JOB 3: Smoke Tests (deploy sonrası)
  # ==========================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Wait for Render to deploy
        run: sleep 60

      - name: Backend health check
        run: |
          echo "Testing backend health..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://isbul-backend.onrender.com/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS - waiting..."
            sleep 15
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Test critical endpoints
        run: |
          echo "Testing /api/v1/experts..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://isbul-backend.onrender.com/api/v1/experts)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Experts endpoint OK"
          else
            echo "❌ Experts endpoint failed (HTTP $STATUS)"
            exit 1
          fi

          echo "Testing /api/v1/calendar/:id/slots..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://isbul-backend.onrender.com/api/v1/calendar/test_id/slots")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Calendar slots endpoint OK"
          else
            echo "❌ Calendar slots endpoint failed (HTTP $STATUS)"
            exit 1
          fi

      - name: Test frontend
        run: |
          echo "Testing frontend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://isbul.online)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend OK"
          else
            echo "❌ Frontend failed (HTTP $STATUS)"
            exit 1
          fi
