name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Deploy Backend to Render
  # ==========================================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render backend deployment
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Backend deployment triggered"
          else
            echo "RENDER_DEPLOY_HOOK not configured"
          fi

  # ==========================================
  # JOB 2: Deploy Frontend to Render
  # ==========================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render frontend deployment
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
            echo "Frontend deployment triggered"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK not configured"
          fi
