name: PR - Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ==========================================
  # JOB 1: PR Info & Validation
  # ==========================================
  pr-info:
    name: 📋 PR Information
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 📊 PR Statistics
        run: |
          echo "## 📊 PR Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.event.pull_request.user.login }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.head_ref }} → ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Changed:** $(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
      - name: 📝 Check PR description
        run: |
          description="${{ github.event.pull_request.body }}"
          
          if [ -z "$description" ]; then
            echo "⚠️ PR description is empty!" >> $GITHUB_STEP_SUMMARY
            echo "Please add a description to explain your changes." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ PR has a description" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: 🏷️ Check labels
        run: |
          labels='${{ toJson(github.event.pull_request.labels) }}'
          label_count=$(echo "$labels" | jq '. | length')
          
          echo "### 🏷️ Labels ($label_count)" >> $GITHUB_STEP_SUMMARY
          
          if [ "$label_count" -eq 0 ]; then
            echo "⚠️ No labels assigned. Consider adding labels like: bug, feature, enhancement, documentation" >> $GITHUB_STEP_SUMMARY
          else
            echo "$labels" | jq -r '.[].name' | while read label; do
              echo "- $label" >> $GITHUB_STEP_SUMMARY
            done
          fi

  # ==========================================
  # JOB 2: Code Changes Analysis
  # ==========================================
  changes:
    name: 🔎 Analyze Changes
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 📊 Changed files by category
        run: |
          echo "## 📂 Changed Files by Category" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Frontend files
          frontend_count=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(html|css)$' | wc -l)
          echo "- **Frontend (HTML/CSS):** $frontend_count files" >> $GITHUB_STEP_SUMMARY
          
          # JavaScript files
          js_count=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.js$' | wc -l)
          echo "- **JavaScript:** $js_count files" >> $GITHUB_STEP_SUMMARY
          
          # Backend files
          backend_count=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'server/' | wc -l)
          echo "- **Backend:** $backend_count files" >> $GITHUB_STEP_SUMMARY
          
          # Config files
          config_count=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(json|yml|yaml)$' | wc -l)
          echo "- **Configuration:** $config_count files" >> $GITHUB_STEP_SUMMARY
          
          # Documentation
          docs_count=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -E '\.(md|txt)$' | wc -l)
          echo "- **Documentation:** $docs_count files" >> $GITHUB_STEP_SUMMARY
          
      - name: 📈 Lines changed
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Code Statistics" >> $GITHUB_STEP_SUMMARY
          git diff --shortstat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # JOB 3: Dependency Check
  # ==========================================
  dependencies:
    name: 📦 Check Dependencies
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🔍 Check package.json changes
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -q 'package.json'; then
            echo "## 📦 Dependency Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ package.json has been modified" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please ensure:" >> $GITHUB_STEP_SUMMARY
            echo "- Dependencies are necessary" >> $GITHUB_STEP_SUMMARY
            echo "- Security audit passes (npm audit)" >> $GITHUB_STEP_SUMMARY
            echo "- Package versions are locked" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No dependency changes" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # JOB 4: Security Review
  # ==========================================
  security-review:
    name: 🔒 Security Review
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🔍 Check for sensitive data
        run: |
          echo "## 🔒 Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for potential secrets
          secret_patterns=("password" "secret" "api_key" "token" "private_key")
          found_issues=0
          
          for pattern in "${secret_patterns[@]}"; do
            matches=$(git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep -i "+.*$pattern" | grep -v "placeholder" | wc -l)
            if [ "$matches" -gt 0 ]; then
              echo "⚠️ Found $matches potential secret(s) containing '$pattern'" >> $GITHUB_STEP_SUMMARY
              found_issues=$((found_issues + 1))
            fi
          done
          
          if [ "$found_issues" -eq 0 ]; then
            echo "✅ No obvious secrets detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Please review these findings carefully!" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # JOB 5: Auto-assign reviewers
  # ==========================================
  assign-reviewers:
    name: 👥 Assign Reviewers
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    
    steps:
      - name: 👥 Request reviews
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR author
            const author = context.payload.pull_request.user.login;
            
            // List of potential reviewers (update with your team)
            const reviewers = ['Umit-dedeoglu'];
            
            // Remove author from reviewers
            const filteredReviewers = reviewers.filter(r => r !== author);
            
            if (filteredReviewers.length > 0) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  reviewers: filteredReviewers
                });
                console.log(`✅ Requested reviews from: ${filteredReviewers.join(', ')}`);
              } catch (error) {
                console.log('⚠️ Could not assign reviewers:', error.message);
              }
            }

  # ==========================================
  # JOB 6: Auto-label PR
  # ==========================================
  auto-label:
    name: 🏷️ Auto-label PR
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🏷️ Add labels based on changes
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const labels = new Set();
            
            files.forEach(file => {
              const path = file.filename;
              
              // Frontend changes
              if (path.match(/\.(html|css)$/)) {
                labels.add('frontend');
              }
              
              // Backend changes
              if (path.match(/^server\//)) {
                labels.add('backend');
              }
              
              // JavaScript changes
              if (path.match(/\.js$/)) {
                labels.add('javascript');
              }
              
              // Documentation
              if (path.match(/\.(md|txt)$/)) {
                labels.add('documentation');
              }
              
              // Configuration
              if (path.match(/\.(json|yml|yaml)$/)) {
                labels.add('configuration');
              }
              
              // Tests
              if (path.match(/test|spec/)) {
                labels.add('tests');
              }
            });
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: Array.from(labels)
              });
              
              console.log(`✅ Added labels: ${Array.from(labels).join(', ')}`);
            }

  # ==========================================
  # JOB 7: Size check
  # ==========================================
  size-check:
    name: 📏 PR Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 📏 Check PR size
        run: |
          additions=$(git diff --numstat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | awk '{sum+=$1} END {print sum}')
          deletions=$(git diff --numstat ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | awk '{sum+=$2} END {print sum}')
          total=$((additions + deletions))
          
          echo "## 📏 PR Size" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Additions:** +$additions" >> $GITHUB_STEP_SUMMARY
          echo "- **Deletions:** -$deletions" >> $GITHUB_STEP_SUMMARY
          echo "- **Total:** $total lines" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$total" -lt 200 ]; then
            echo "✅ **Size: Small** - Quick to review" >> $GITHUB_STEP_SUMMARY
          elif [ "$total" -lt 500 ]; then
            echo "⚠️ **Size: Medium** - May take some time to review" >> $GITHUB_STEP_SUMMARY
          else
            echo "🔴 **Size: Large** - Consider breaking into smaller PRs" >> $GITHUB_STEP_SUMMARY
          fi

  # ==========================================
  # FINAL: PR Summary
  # ==========================================
  pr-summary:
    name: 📊 PR Summary
    runs-on: ubuntu-latest
    needs: [pr-info, changes, dependencies, security-review, size-check]
    if: always()
    
    steps:
      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            const comment = `## 🤖 PR Check Summary
            
            Hi @${pr.user.login}! Thanks for your contribution! 🎉
            
            I've analyzed your PR and here's what I found:
            
            ### ✅ Completed Checks
            - Code quality analysis
            - Security scan
            - Dependency review
            - Size check
            
            ### 📋 Next Steps
            1. Wait for CI/CD checks to complete
            2. Address any review comments
            3. Ensure all tests pass
            4. Get approval from reviewers
            
            Once everything is green, your PR will be ready to merge! 🚀
            
            ---
            *This is an automated message from GitHub Actions*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: comment
            });
