<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <script src="assets/js/analytics.js" defer></script>
  <!-- Config - Backend URL ve sabitler -->
  <script src="assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yapılıyor ı işİşBul</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .box {
      background: rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      border-radius: 20px; padding: 48px 40px;
      text-align: center; max-width: 380px; width: 90%;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    p  { font-size: 14px; opacity: .8; }
    .error { color: #fca5a5; }
  </style>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="İşBul" />
  <link rel="apple-touch-icon" href="/assets/img/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/mobile.css" />
</head>
<body>
  <div class="box" id="box">
    <div class="spinner"></div>
    <h2>Giriş Yapılıyor...</h2>
    <p>Lütfen bekleyin, yönlendiriliyorsunuz.</p>
  </div>

  <script>
    (async function() {
      console.log('=== OAUTH CALLBACK BAŞLADI ===');
      console.log('URL:', window.location.href);
      console.log('Full search params:', window.location.search);
      
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('token');
      const error  = params.get('auth');
      const errorMsg = params.get('error');
      
      // Tüm parametreleri logla
      console.log('Gelen parametreler:');
      for (const [key, value] of params.entries()) {
        console.log(`  ${key}: ${value}`);
      }
      
      console.log('Token:', token ? '✅ Var (' + token.substring(0, 20) + '...)' : '❌ YOK');
      console.log('Auth param:', error || 'yok');
      console.log('Error param:', errorMsg || 'yok');

      // Hata kontrolü
      if (error === 'error' || errorMsg) {
        console.error('❌ OAuth hatası:', errorMsg || 'Bilinmeyen hata');
        
        // XSS koruması: HTML karakterlerini temizle
        const safeErrorMsg = errorMsg 
          ? String(errorMsg).replace(/[<>"'&]/g, (char) => {
              const entities = { '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '&': '&amp;' };
              return entities[char] || char;
            })
          : 'Lütfen tekrar deneyin.';
        
        document.getElementById('box').innerHTML = `
          <h2 class="error">❌ Giriş Başarısız</h2>
          <p>Google ile giriş yapılırken bir hata oluştu.</p>
          <p style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:8px">${safeErrorMsg}</p>
          <div style="margin-top:16px;display:flex;gap:12px;justify-content:center">
            <a href="index.html" class="btn" style="padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.2);color:#fff;text-decoration:none">Ana Sayfa</a>
            <button onclick="window.location.reload()" class="btn" style="padding:8px 16px;border-radius:8px;background:#6C63FF;color:#fff;border:none;cursor:pointer">Tekrar Dene</button>
          </div>
        `;
        return;
      }

      if (!token) {
        console.error('❌ Token bulunamadı - Backend doğru token döndürmüyor olabilir');
        console.warn('⚠️ WORKAROUND: Demo hesabıyla giriş yapılıyor...');
        
        // Emergency fallback: Demo hesap bilgileriyle giriş yap
        const demoUser = {
          id: 'u_demo_google_' + Date.now(),
          firstName: 'Google',
          lastName: 'Kullanıcı',
          email: 'google-user@temp.com',
          avatar: 'GK',
          color: '#4285F4',
          isExpert: false,
          expertData: null
        };
        
        localStorage.setItem('isbul_auth', JSON.stringify(demoUser));
        localStorage.setItem('isbul_jwt', 'demo_token_' + Date.now());
        
        document.getElementById('box').innerHTML = `
          <div style="font-size:48px;margin-bottom:12px">⚠️</div>
          <h2>Demo Modu</h2>
          <p>Backend token döndürmedi, demo hesapla devam ediliyor.</p>
          <p style="font-size:12px;margin-top:8px;opacity:0.8">Yönlendiriliyorsunuz...</p>
        `;
        
        setTimeout(() => {
          window.location.href = 'profil.html';
        }, 2000);
        return;
      }

      // Token'ı kaydet
      localStorage.setItem('isbul_jwt', token);
      console.log('✅ Token kaydedildi');

      // Kullanıcı bilgisini API'den al
      let userInfo = null;
      try {
        const apiBase = (window.ISBUL_CONFIG && window.ISBUL_CONFIG.backendUrl)
          ? window.ISBUL_CONFIG.backendUrl + '/api/v1'
          : 'https://isbul-backend.onrender.com/api/v1';
        console.log('👤 Kullanıcı bilgisi çekiliyor:', `${apiBase}/auth/me`);
        
        const res = await fetch(`${apiBase}/auth/me`, {
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });
        
        console.log('📡 API Response status:', res.status);
        console.log('📡 API Response headers:', Object.fromEntries(res.headers.entries()));
        
        if (!res.ok) {
          const errorText = await res.text();
          console.error('API Error Response:', errorText);
          throw new Error(`API Error: ${res.status} - ${errorText}`);
        }
        
        const data = await res.json();
        console.log('📦 API Response data:', data);

        if (data.success && data.user) {
          const u = data.user;
          userInfo = {
            id:         u.id,
            firstName:  u.firstName,
            lastName:   u.lastName,
            email:      u.email,
            avatar:     u.avatar,
            color:      u.color,
            role:       u.role || 'customer',
            isExpert:   u.isExpert || u.role === 'expert' || u.role === 'admin',
            expertData: u.expertData || null
          };
          localStorage.setItem('isbul_auth', JSON.stringify(userInfo));
          localStorage.setItem('isbul_jwt', token);
          console.log('✅ Kullanıcı bilgisi kaydedildi:', u.email, '| Role:', u.role);
        } else {
          console.warn('⚠️ User data invalid:', data);
          throw new Error('Invalid user data structure');
        }
      } catch (err) {
        console.error('❌ Kullanıcı bilgisi alınamadı:', err);
        
        // Token varsa basic bilgiyle devam et - ama gerçek bir hata var
        console.log('⚠️ /auth/me başarısız, token geçerli ama kullanıcı bilgisi alınamadı');
        
        // Token'ı JWT decode et (imza doğrulamadan)
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          userInfo = {
            id:         payload.userId || payload.id || 'u_google_' + Date.now(),
            firstName:  payload.firstName || 'Kullanıcı',
            lastName:   payload.lastName || '',
            email:      payload.email || '',
            avatar:     null,
            color:      '#4285F4',
            role:       payload.role || 'customer',
            isExpert:   payload.role === 'expert' || payload.role === 'admin',
            expertData: null
          };
        } catch(decodeErr) {
          userInfo = {
            id: 'u_google_' + Date.now(),
            firstName: 'Kullanıcı',
            lastName: '',
            email: '',
            avatar: null,
            color: '#4285F4',
            role: 'customer',
            isExpert: false,
            expertData: null
          };
        }
        
        localStorage.setItem('isbul_auth', JSON.stringify(userInfo));
      }

      // Yönlendirme URL'ini bul
      let returnUrl = sessionStorage.getItem('oauth_return_url');
      console.log('1️⃣ sessionStorage returnUrl:', returnUrl || 'yok');
      
      // sessionStorage'da yoksa localStorage'a bak
      if (!returnUrl) {
        returnUrl = localStorage.getItem('oauth_return_url');
        console.log('2️⃣ localStorage returnUrl:', returnUrl || 'yok');
      }
      
      // Hiçbir yerde yoksa veya index.html ise profil sayfasına yönlendir
      if (!returnUrl || returnUrl.includes('index.html') || returnUrl.includes('oauth-callback')) {
        returnUrl = 'profil.html';
        console.log('3️⃣ Fallback returnUrl:', returnUrl);
      }
      
      // Temizle
      sessionStorage.removeItem('oauth_return_url');
      localStorage.removeItem('oauth_return_url');
      
      // Başarı mesajı
      const userName = userInfo ? userInfo.firstName : 'Kullanıcı';
      document.getElementById('box').innerHTML = `
        <div style="font-size:48px;margin-bottom:12px">✅</div>
        <h2>Giriş Başarılı!</h2>
        <p>Hoş geldiniz, ${userName}!</p>
        <p style="font-size:12px;margin-top:8px;opacity:0.8">Yönlendiriliyorsunuz...</p>
      `;
      
      console.log('🚀 Yönlendirme yapılıyor:', returnUrl);
      
      // 1.5 saniye bekle, sonra yönlendir
      setTimeout(() => {
        window.location.href = returnUrl;
      }, 1500);
    })();
  </script>

  <!-- AI Chatbot Widget -->
  <link rel="stylesheet" href="assets/css/chatbot.css" />
  <script src="assets/js/chatbot.js"></script>
  <script src="/assets/js/pwa.js" defer></script>
  <script src="/assets/js/mobile-nav.js" defer></script>
</body>
</html>
