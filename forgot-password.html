<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Config - Backend URL ve sabitler -->
  <script src="assets/js/config.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifremi Unuttum – İşBul</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#6C63FF" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="İşBul" />
  <link rel="apple-touch-icon" href="/assets/img/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/mobile.css" />
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6C63FF,#764ba2);padding:20px">
    <div style="background:#fff;border-radius:16px;padding:40px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)">
      <h1 style="font-size:24px;font-weight:800;margin-bottom:8px;text-align:center">Şifremi Unuttum</h1>
      <p style="color:var(--text-muted);font-size:14px;margin-bottom:32px;text-align:center">E-posta adresinize şifre sıfırlama linki göndereceğiz.</p>
      
      <form id="forgotForm">
        <div style="margin-bottom:20px">
          <label style="display:block;font-weight:600;margin-bottom:8px;font-size:14px">E-posta</label>
          <input type="email" id="email" required placeholder="ornek@email.com" style="width:100%;padding:12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px">
        </div>
        
        <button type="submit" class="btn btn--primary" style="width:100%;margin-bottom:16px">Sıfırlama Linki Gönder</button>
      </form>
      
      <div style="text-align:center">
        <a href="login.html" style="color:var(--primary);font-size:14px;font-weight:600">← Giriş sayfasına dön</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api-client.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = e.target.querySelector('button');
      const origText = btn.textContent;
      btn.textContent = 'Gönderiliyor...';
      btn.disabled = true;

      try {
        const res = await fetch(`${IsBulAPI.baseUrl}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (data.success) {
          alert('✅ ' + data.message + (data.devLink ? '\n\nDev Link:\n' + data.devLink : ''));
          if (data.devToken) {
            // Development: Direkt reset sayfasına yönlendir
            window.location.href = `reset-password.html?token=${data.devToken}`;
          }
        } else {
          alert('❌ ' + (data.error || 'Bir hata oluştu.'));
          btn.textContent = origText;
          btn.disabled = false;
        }
      } catch (err) {
        alert('❌ Bağlantı hatası. Lütfen tekrar deneyin.');
        btn.textContent = origText;
        btn.disabled = false;
      }
    });
  </script>
  <script src="/assets/js/pwa.js" defer></script>
  <script src="/assets/js/mobile-nav.js" defer></script>

  <!-- ========== FOOTER ========== -->
    <div id="footer-container"></div>

</body>
</html>
